services:
  agent:
    build: .
    container_name: aiops-agent
    ports:
      - "8000:8000"
    environment:
      APP_API_KEY: ${APP_API_KEY:-dev-key-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - agent_data:/app/data
      - agent_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3

  worker:
    build: .
    container_name: aiops-agent-worker
    command: ["python", "-m", "app.worker"]
    environment:
      APP_API_KEY: ${APP_API_KEY:-dev-key-change-me}
      CONTROL_PLANE_URL: http://agent:8000
      WORKER_NAME: worker-1
      WORKER_CPU_CAPACITY: "2"
      WORKER_MEMORY_MB: "2048"
      LOG_FILE_PATH: /app/logs/agent.log
      WORKER_TTL_SECONDS: "60"
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "10"
      WORKER_POLL_INTERVAL_SECONDS: "1"
    volumes:
      - agent_logs:/app/logs
    depends_on:
      agent:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aiops-agent-prometheus
    depends_on:
      agent:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aiops-agent-grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  agent_data:
  agent_logs:
