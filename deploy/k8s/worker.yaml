apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent-worker
  namespace: aiops-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-agent-worker
  template:
    metadata:
      labels:
        app: aiops-agent-worker
    spec:
      containers:
        - name: worker
          image: aiops-agent:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: aiops-agent-config
          env:
            - name: CONTROL_PLANE_URL
              value: http://aiops-agent-api:8000
            - name: WORKER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_CPU_CAPACITY
              value: "1"
            - name: WORKER_MEMORY_MB
              value: "1024"
